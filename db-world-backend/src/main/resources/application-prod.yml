spring:
  # No `config.activate.on-profile` here — the filename already scopes this file
  # to the `prod` profile, and Spring Boot 4 lists that key among the ones that
  # are invalid inside a profile-specific resource.

  # Lazy-init every bean — they're created on first use rather than at boot.
  # @Scheduled / @EventListener processors still register eagerly via bean
  # post-processors so background work isn't broken. Local-only because the
  # first request after boot pays the bean-creation cost; in prod we keep
  # everything eager so health checks see a fully-warm context.
  main:
    lazy-initialization: false

# ===========================
# Common Application Properties
# ===========================
app:
  name: db-world
  # MUST stay quoted. Maven filters this to the pom version, but any build that
  # copies resources without Maven's filtering (VS Code's Java language server
  # does exactly that, into this same target/classes) leaves the literal text —
  # and `@` cannot start a plain YAML scalar, so the whole file fails to parse
  # and every app.* property silently binds as null.
  version: "@project.version@"
  base-path: /app/db_world
  data-path: /srv/dbworld
  stream-path: /srv/dbworld/streams
  symlink-path: /srv/dbworld/symlinks

  # The USB disk is mounted `nofail`, so a boot without it leaves data-path as an empty
  # directory on the SD card. A "same filesystem as /" test cannot tell inside a container,
  # so the proof is a file created once on the disk itself, by the host admin, while it is
  # mounted:  sudo dbworldctl media-disk mark   (db-world-config; it refuses if the HDD is not
  # mounted). Without it every media feature treats the disk as missing, so it must exist
  # BEFORE a build with this setting is deployed. See AppProperties.MediaDisk.
  media-disk:
    marker: ${app.data-path}/.dbworld-media-disk

  paths:
    logs: ${app.base-path}/logs
    main-log: ${app.paths.logs}/${app.name}-info.json
    download-log: ${app.paths.logs}/nginx/download_tracker.log
    config: ${app.base-path}/config
    temp: ${app.data-path}/temp
    downloads: ${app.data-path}/downloads
    integration: ${app.data-path}/integration
    torrents: ${app.stream-path}/Torrent Download
    archived-logs: ${app.paths.logs}/archived
    external-videos: /home/dbworld_admin/ext_hdisk_1/videos

  cdn:
    base-url: https://cdn.db-world.in

  tools:
    yt-dlp: yt-dlp
    ffmpeg: ffmpeg
    seven-zip: 7z
    mediainfo: mediainfo
    hs-cookies: ${app.base-path}/cookies/hotstar.txt
    cookies-dir: ${app.base-path}/cookies

server:
  port: ${SERVER_PORT:9090}

cors:
  allowed-origins: https://db-world.in

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    # DEBUG so com.db.dbworld DEBUG events reach log4j2's LevelRangeFilter and
    # land in db-world-debug.log. INFO+ still routes to db-world-info.log
    # (different appender filter), so this does not inflate info-log volume.
    com.db.dbworld: DEBUG
# SonarCloud config for the db-world mono-repo (backend Java + frontend JS).
# Free for public repos. The GitHub Actions workflow (.github/workflows/sonar.yml)
# runs the tests to produce the coverage reports referenced below, then the scanner.
#
# BEFORE THE FIRST RUN — two manual steps only Claude can't do:
#   1. Create/import the project at https://sonarcloud.io (sign in with GitHub),
#      then confirm the two keys below match what SonarCloud shows
#      (Organization key on the org page; Project key under Administration).
#   2. Add repo secret SONAR_TOKEN (Settings → Secrets → Actions) — the token
#      SonarCloud generates for this project.
sonar.organization=mr-bhavya
sonar.projectKey=Mr-Bhavya_db-world
sonar.projectName=db-world

# --- Sources & tests -------------------------------------------------------
# Frontend tests are interspersed in src/, so src/ is listed only under sources
# and the test files are reclassified via test.inclusions (listing a path under
# both sonar.sources and sonar.tests makes Sonar fail with "indexed twice").
sonar.sources=db-world-backend/src/main/java,db-world-frontend/src
sonar.tests=db-world-backend/src/test/java
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# --- Java (compiled by `mvn test` in CI) -----------------------------------
sonar.java.binaries=db-world-backend/target/classes
sonar.java.test.binaries=db-world-backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=db-world-backend/target/site/jacoco/jacoco.xml
# For deeper Java rules, add a classpath: run `mvn dependency:copy-dependencies`
# in CI and uncomment the next line.
# sonar.java.libraries=db-world-backend/target/dependency/*.jar

# --- JavaScript (coverage from Vitest V8) ----------------------------------
sonar.javascript.lcov.reportPaths=db-world-frontend/coverage/lcov.info

# --- Exclusions ------------------------------------------------------------
sonar.exclusions=**/node_modules/**,db-world-frontend/dist/**,db-world-frontend/android/**,db-world-frontend/public/**,**/*.min.js,**/target/**
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.config.js,db-world-frontend/src/main.jsx
sonar.sourceEncoding=UTF-8

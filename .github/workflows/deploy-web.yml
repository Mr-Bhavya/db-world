name: Deploy Web (frontend only)

# Fast, standalone WEB release: build the frontend bundle and deploy it straight to the Pi — with
# NO Android APK, NO GitHub Release, and NO in-app-updater involvement. Use this for early / minor
# web changes you want live quickly.
#
# The FULL versioned app release (frontend + APK + updater metadata) still lives in release.yml —
# use that when you ship a new Android app version (the APK always re-embeds the current web).
#
# Manual trigger only (Actions → Deploy Web → Run workflow). Gated by the `production` Environment,
# so you can require an approval before it goes live (same as deploy.yml).
#
# Secret used: FRONTEND_ENV_PRODUCTION (full contents of the prod .env, incl. VITE_FIREBASE_*).
on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  # ── Build on a cloud runner (fast, disposable) ─────────────────────────────
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build web bundle
        working-directory: db-world-frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          npm install --no-audit --no-fund
          if [ -n "$FRONTEND_ENV_PRODUCTION" ]; then
            mkdir -p ../runtime
            printf '%s' "$FRONTEND_ENV_PRODUCTION" > ../runtime/.env.production
            npm run build:production
          else
            echo "FRONTEND_ENV_PRODUCTION not set — building with default env."
            npm run build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: db-world-frontend/dist
          if-no-files-found: error

  # ── Deploy on the Pi (self-hosted runner) — mirrors deploy.yml's frontend step ──
  deploy:
    name: Deploy to Pi
    needs: build
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - name: Publish to /var/www/dbworld
        run: |
          set -euxo pipefail
          REL="/var/www/dbworld/releases/$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$REL"
          cp -r dist/. "$REL/"
          ln -sfn "$REL" /var/www/dbworld/current
          # keep only the last 5 releases
          ls -dt /var/www/dbworld/releases/* | tail -n +6 | xargs rm -rf || true
          echo "Deployed web -> $REL"

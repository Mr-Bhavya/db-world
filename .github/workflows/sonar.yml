name: SonarCloud

# Coverage + static analysis on SonarCloud (free for public repos). Runs the tests to
# produce coverage — backend JaCoCo XML + frontend Vitest lcov — then the Sonar scanner
# (config in sonar-project.properties). GitHub-hosted runner, deliberately NOT the Pi:
# analysis is CPU-heavy and needs network, and the whole point is to spare the Pi.
#
# Requires repo secret SONAR_TOKEN. Runs on the two long-lived branches — development
# (where feature branches land) and main — so analysis happens as you work, not only at
# release. Short-lived feature/integration branches are covered by their PR into these.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch: {}

jobs:
  sonar:
    name: Coverage & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history → accurate new-code detection for the quality gate

      # --- Backend: run the suite → target/site/jacoco/jacoco.xml ---
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend tests + JaCoCo coverage
        working-directory: db-world-backend
        run: mvn -B -ntp test

      # --- Frontend: run the suite → coverage/lcov.info ---
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # `npm ci` — reproducible install from the tracked lockfile (see ci.yml).
      - name: Frontend deps
        working-directory: db-world-frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend tests + coverage
        working-directory: db-world-frontend
        run: npm run test:coverage

      # --- SonarCloud scan (reads sonar-project.properties at repo root) ---
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Name the analysed branch explicitly on push/workflow_dispatch. Without this a
          # manual dispatch on a feature branch was published as `main`, overwriting main's
          # analysis with unmerged code (and flipping its quality gate red). This can't live
          # in sonar-project.properties: a fixed value there would pin every analysis to one
          # branch name. On pull_request it must stay unset — the action injects the
          # sonar.pullrequest.* parameters itself, and adding sonar.branch.name alongside
          # them breaks PR decoration.
          args: "${{ github.event_name != 'pull_request' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}"

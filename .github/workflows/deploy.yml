name: Deploy & Release

# Builds AND ships each ticked component. Manual only (workflow_dispatch). Tick any combination:
#   • Backend  — build the container image, push it to GHCR and run it on the Pi with
#                dbworld-compose (Docker is the only backend runtime)
#   • Frontend — build the web bundle and deploy it to Cloudflare Workers (static assets)
#   • Android  — build the SIGNED APK + version.json and publish a versioned GitHub Release
#                (the source the in-app updater reads)
#
# Release number (Android): the `version` input, e.g. 3.1.0 (blank = auto-bump the patch of the
# latest published release). versionCode is an auto UTC timestamp (always increasing).
#
# Every deploy job runs under the `production` Environment — add a required reviewer there to
# gate every prod ship. Only the backend deploy uses the self-hosted runner on the Pi.
#
# Secrets (put them on the `production` Environment): FRONTEND_ENV_PRODUCTION,
# CLOUDFLARE_API_TOKEN (scope: Account > Workers Scripts: Edit, this account only),
# CLOUDFLARE_ACCOUNT_ID, GOOGLE_SERVICES_JSON_BASE64, ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#
# Cloudflare config lives in db-world-frontend/wrangler.jsonc (Worker name, custom domain,
# SPA fallback). It holds no secrets and is safe to commit.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Build the backend image and deploy it to the Pi with dbworld-compose
        type: boolean
        default: false
      ytdlp_latest:
        description: "Backend: build with the newest yt-dlp release instead of the Dockerfile's pin — for when YouTube downloads break"
        type: boolean
        default: false
      frontend:
        description: Deploy the frontend web bundle to Cloudflare
        type: boolean
        default: true
      android:
        description: Build + publish the signed Android APK release
        type: boolean
        default: false
      ref:
        description: "Version to deploy/release — branch, tag (e.g. v3.0.3) or SHA. Blank = the ref you launched from. Pick a PREVIOUS tag to roll back."
        required: false
      version:
        description: "Android release version, e.g. 3.1.0 (blank = auto-bump latest patch). Ignored for backend/frontend."
        required: false
      mandatory:
        description: "Android: force (mandatory) update?"
        type: boolean
        default: false
      audience:
        description: "Android: who sees the update prompt — 'all' (everyone) or 'admin' (ADMIN/OWNER only, for admin-only changes)"
        type: choice
        options:
          - all
          - admin
        default: all
      changelog:
        description: "Android: release notes shown in the update dialog"
        required: false

# Least privilege by default: only android-release publishes a Release, so only that
# job gets contents:write (see its own permissions block). The build/deploy jobs just
# need to read the repo.
permissions:
  contents: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve deployment commit
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Pin source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Backend: build + push the image, then run it on the Pi ─────────────────
  backend-image:
    name: Backend · build image
    needs: resolve-source
    if: ${{ github.event.inputs.backend == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend-image.yml
    with:
      ref: ${{ needs.resolve-source.outputs.revision }}
      push: true
      ytdlp: ${{ github.event.inputs.ytdlp_latest == 'true' && 'latest' || '' }}

  backend-deploy:
    name: Backend · deploy container to Pi
    needs: backend-image
    runs-on: self-hosted
    environment: production
    steps:
      # Pull, restart, health-check, and on failure start the previous tag again.
      # To roll back later: `sudo dbworld-compose rollback app` on the Pi, or deploy an
      # older ref here. The runner's sudo rule allows exactly
      # `dbworld-compose deploy app <tag>` (sudoers.d/dbworld-deploy in db-world-config).
      - name: Deploy image
        env:
          TAG: ${{ needs.backend-image.outputs.tag }}
        run: sudo /usr/local/bin/dbworld-compose deploy app "$TAG"

  # ── Frontend: build the web bundle on a cloud runner ───────────────────────
  frontend-build:
    name: Frontend · build web
    needs: resolve-source
    if: ${{ github.event.inputs.frontend == 'true' || github.event.inputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.revision }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db-world-frontend/package-lock.json
      - name: Build web bundle
        working-directory: db-world-frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          npm ci --no-audit --no-fund
          # No silent fallback to `npm run build`. That path compiles fine with no
          # env at all, so every VITE_* inlines as undefined and the deploy looks
          # healthy while features quietly do nothing.
          if [ -z "$FRONTEND_ENV_PRODUCTION" ]; then
            echo "::error::FRONTEND_ENV_PRODUCTION secret is not set."
            echo "A production bundle built without it has no API URL, no Firebase"
            echo "config and no ad slots, and fails silently rather than loudly."
            exit 1
          fi
          mkdir -p ../runtime && printf '%s' "$FRONTEND_ENV_PRODUCTION" > ../runtime/.env.production
          # Catches a secret that has drifted behind the code -- adding a VITE_* var
          # does not update the secret, and the resulting gap is invisible at build,
          # deploy and runtime.
          bash ../scripts/ci/check-frontend-env.sh ../runtime/.env.production ../runtime/.env.example
          npm run build:production
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: db-world-frontend/dist
          if-no-files-found: error
          # Public repo: anyone signed in can download artifacts. Only this run needs it.
          retention-days: 1

  # ── Frontend: deploy the bundle to Cloudflare Workers (static assets) ──────
  frontend-deploy:
    name: Frontend · deploy to Cloudflare
    needs: [resolve-source, frontend-build, backend-deploy]
    # Waits for the backend when it's ticked, so the new UI never goes live ahead of
    # the API it calls.
    if: >-
      ${{ always() && !cancelled() && github.event.inputs.frontend == 'true'
          && needs.frontend-build.result == 'success'
          && (github.event.inputs.backend != 'true' || needs.backend-deploy.result == 'success') }}
    # GitHub-hosted: a fresh workspace every run, so no stale dist/ to clear, and no
    # code from this public repo runs on the Pi for a frontend ship.
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Only wrangler.jsonc is needed from the repo; the bundle comes from the artifact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.revision }}
          sparse-checkout: db-world-frontend/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: db-world-frontend/dist
      - name: Deploy to Cloudflare Workers
        # TODO: pin to a full commit SHA (like softprops below) — this step holds the
        # Cloudflare deploy token. Look up the SHA for the v4 tag in cloudflare/wrangler-action.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: db-world-frontend
          # Tags the Cloudflare version with the commit, so `wrangler deployments list`
          # shows exactly what is live.
          command: deploy --message "${{ needs.resolve-source.outputs.revision }}"

  # ── Android: compile in parallel; publishing below waits for deployments ──
  android-build:
    name: Android · build signed APK
    needs: [resolve-source, frontend-build]
    if: ${{ github.event.inputs.android == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.revision }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db-world-frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version (name + code)
        id: ver
        env:
          REPO: ${{ github.repository }}
          IN_NAME: ${{ github.event.inputs.version }}
        run: |
          NAME="$IN_NAME"
          # Blank version → auto-bump the patch of the latest published release (3.1.0 -> 3.1.1).
          if [ -z "$NAME" ]; then
            # --proto '=https' --proto-redir '=https' so -L can't be walked down to
            # plaintext http by a redirect; the resolved version drives the release tag.
            LATEST=$(curl -fsSL --proto '=https' --proto-redir '=https' "https://api.github.com/repos/$REPO/releases/latest" 2>/dev/null \
                     | grep -m1 '"tag_name"' | sed 's/.*: *"\(.*\)".*/\1/' || true)
            LATEST="${LATEST#v}"
            if [ -z "$LATEST" ]; then NAME="3.0.0"; else
              NAME=$(echo "$LATEST" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')
            fi
          fi
          NAME="${NAME#v}"
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Android version must be a numeric major.minor.patch version."
            exit 1
          fi
          # Minutes since the Unix epoch: monotonic + minute-granular AND stays inside Android's
          # signed-int versionCode (~29.7M now). The old yymmddHHmm was 10 digits (~2.6B) and
          # overflowed int → "For input string" build failure.
          CODE="$(( $(date -u +%s) / 60 ))"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved v$NAME (versionCode $CODE)"

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: db-world-frontend/dist

      - name: Install dependencies and sync shared web bundle
        working-directory: db-world-frontend
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Inject google-services.json (Firebase / FCM)
        working-directory: db-world-frontend
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 — released APK will lack push (FCM)."
          fi

      - name: Configure release signing
        working-directory: db-world-frontend/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            echo "Release signing configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 — APK will be DEBUG-signed (not for public release)."
          fi

      - name: Assemble release APK
        working-directory: db-world-frontend/android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          # --stacktrace because packageRelease can fail with nothing but
          # "A failure occurred while executing
          #  PackageAndroidArtifact$IncrementalSplitterRunnable" — the real cause is
          # inside the packaging worker and is only printed with a stack trace. Without
          # it a failed release build tells you which task died and nothing about why,
          # which is where 2026-09-06 went. Cheap: it adds nothing to a passing run.
          ./gradlew assembleRelease --stacktrace \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/db-world-${VERSION_NAME}.apk"

      - name: Write version.json (updater metadata)
        env:
          CODE: ${{ steps.ver.outputs.code }}
          NAME: ${{ steps.ver.outputs.name }}
          MAND: ${{ github.event.inputs.mandatory }}
          AUDIENCE: ${{ github.event.inputs.audience }}
          LOG: ${{ github.event.inputs.changelog }}
        run: |
          [ -z "$MAND" ] && MAND=false
          [ -z "$AUDIENCE" ] && AUDIENCE=all
          APK="https://github.com/${{ github.repository }}/releases/download/v${NAME}/db-world-${NAME}.apk"
          jq -n --argjson code "$CODE" --arg name "$NAME" --argjson mandatory "$MAND" \
                --arg audience "$AUDIENCE" --arg apk "$APK" --arg changelog "$LOG" \
             '{versionCode:$code, versionName:$name, mandatory:$mandatory, minSupportedCode:0, releaseAudience:$audience, apkUrl:$apk, changelog:$changelog}' \
             > "$GITHUB_WORKSPACE/version.json"
          cat "$GITHUB_WORKSPACE/version.json"

      - uses: actions/upload-artifact@v7
        with:
          name: android-release-files
          path: |
            db-world-*.apk
            version.json
          if-no-files-found: error
          # The signed APK is published on the Release anyway; no need to keep a copy here.
          retention-days: 1

  android-release:
    name: Android · publish APK release
    needs: [resolve-source, android-build, backend-deploy, frontend-deploy]
    if: >-
      ${{ always() && !cancelled() && github.event.inputs.android == 'true'
          && needs.android-build.result == 'success'
          && (github.event.inputs.backend != 'true' || needs.backend-deploy.result == 'success')
          && (github.event.inputs.frontend != 'true' || needs.frontend-deploy.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release-files
          path: release

      - name: Publish GitHub Release
        # Pinned to a full commit SHA: a mutable tag on a third-party action can be
        # repointed at malicious code, and this job holds contents:write. v3 = 3d0d988.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.android-build.outputs.version }}
          name: v${{ needs.android-build.outputs.version }}
          target_commitish: ${{ needs.resolve-source.outputs.revision }}
          generate_release_notes: true
          files: |
            release/db-world-*.apk
            release/version.json

name: Deploy & Release

# Manual deploy pipeline. Tick any combination of components when starting a run:
#   • Backend  — build the Docker image, push it to GHCR, run it on the Pi via dbworld-compose
#   • Frontend — build the web bundle and publish it to Cloudflare Workers (static assets)
#   • Android  — build the signed APK + version.json and publish a GitHub Release
#                (the in-app updater reads version.json from the latest release)
#
# All deploy jobs use the `production` Environment; add a required reviewer there to gate them.
#
# Secrets (on the `production` Environment):
#   FRONTEND_ENV_PRODUCTION      .env.production contents for the Vite build
#   CLOUDFLARE_API_TOKEN         Cloudflare token with Workers Scripts: Edit on this account only
#   CLOUDFLARE_ACCOUNT_ID        Cloudflare account that owns the Worker
#   GOOGLE_SERVICES_JSON_BASE64  Firebase config for push notifications (optional)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Cloudflare settings (Worker name, domain, SPA fallback) live in db-world-frontend/wrangler.jsonc.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Build the backend image and deploy it to the Pi
        type: boolean
        default: false
      ytdlp_latest:
        description: "Backend: use the newest yt-dlp release instead of the Dockerfile's pinned version"
        type: boolean
        default: false
      frontend:
        description: Deploy the frontend web bundle to Cloudflare
        type: boolean
        default: true
      android:
        description: Build and publish the signed Android APK release
        type: boolean
        default: false
      ref:
        description: "Branch, tag (e.g. v3.0.3) or SHA to deploy. Blank = the ref you launched from. Use an older tag to roll back."
        required: false
      version:
        description: "Android release version, e.g. 3.1.0. Blank = bump the patch of the latest release."
        required: false
      mandatory:
        description: "Android: force users to install this update"
        type: boolean
        default: false
      audience:
        description: "Android: who sees the update prompt — 'all' or 'admin' (ADMIN/OWNER only)"
        type: choice
        options:
          - all
          - admin
        default: all
      changelog:
        description: "Android: release notes shown in the update dialog"
        required: false

# Read-only by default; jobs that need more request it themselves.
permissions:
  contents: read

# One deploy at a time; a new run queues instead of cancelling the one in progress.
concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  # ── Resolve the requested ref to one fixed commit used by every job ────────
  resolve-source:
    name: Resolve deployment commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      # Looks up the SHA through the API, so no checkout is needed.
      - name: Resolve ref to commit SHA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.inputs.ref || github.sha }}
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "revision=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$REF\` → \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Backend: build and push the container image (reusable workflow) ────────
  backend-image:
    name: Backend · build image
    needs: resolve-source
    if: ${{ github.event.inputs.backend == 'true' }}
    permissions:
      contents: read
      packages: write   # push to GHCR
    uses: ./.github/workflows/backend-image.yml
    with:
      ref: ${{ needs.resolve-source.outputs.revision }}
      push: true
      ytdlp: ${{ github.event.inputs.ytdlp_latest == 'true' && 'latest' || '' }}

  # ── Backend: run the new image on the Pi (self-hosted runner) ──────────────
  backend-deploy:
    name: Backend · deploy container to Pi
    needs: backend-image
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    steps:
      # dbworld-compose pulls the tag, restarts the app, health-checks it and starts
      # the previous tag again if the check fails. The runner's sudoers rule allows
      # only this exact command. Manual rollback on the Pi: `sudo dbworld-compose rollback app`.
      - name: Deploy image
        env:
          TAG: ${{ needs.backend-image.outputs.tag }}
        run: sudo /usr/local/bin/dbworld-compose deploy app "$TAG"

      - name: Write summary
        env:
          TAG: ${{ needs.backend-image.outputs.tag }}
        run: echo "Backend running image tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Frontend: build the web bundle (shared by Cloudflare and Android) ──────
  frontend-build:
    name: Frontend · build web
    needs: resolve-source
    if: ${{ github.event.inputs.frontend == 'true' || github.event.inputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db-world-frontend/package-lock.json

      - name: Install dependencies
        working-directory: db-world-frontend
        run: npm ci --no-audit --no-fund

      # Fails the run if the secret is missing: a build without it still succeeds,
      # but every VITE_* value becomes undefined (no API URL, Firebase or ads).
      - name: Write production env file
        working-directory: db-world-frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          if [ -z "$FRONTEND_ENV_PRODUCTION" ]; then
            echo "::error::FRONTEND_ENV_PRODUCTION secret is not set."
            exit 1
          fi
          mkdir -p ../runtime
          printf '%s' "$FRONTEND_ENV_PRODUCTION" > ../runtime/.env.production

      # Fails if .env.example lists a VITE_* variable the secret doesn't define.
      - name: Check env file against .env.example
        working-directory: db-world-frontend
        run: bash ../scripts/ci/check-frontend-env.sh ../runtime/.env.production ../runtime/.env.example

      - name: Build web bundle
        working-directory: db-world-frontend
        run: npm run build:production

      # Ships wrangler.jsonc with the bundle, so the Cloudflare job needs no checkout.
      # Both paths share db-world-frontend/, so the artifact contains dist/ + wrangler.jsonc.
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            db-world-frontend/dist
            db-world-frontend/wrangler.jsonc
          if-no-files-found: error
          retention-days: 1   # public repo: keep artifacts only as long as this run needs them

  # ── Frontend: publish the bundle to Cloudflare Workers ─────────────────────
  frontend-deploy:
    name: Frontend · deploy to Cloudflare
    needs: [resolve-source, frontend-build, backend-deploy]
    # Runs after the backend when both are ticked, so the UI never goes live before its API.
    if: >-
      ${{ always() && !cancelled() && github.event.inputs.frontend == 'true'
          && needs.frontend-build.result == 'success'
          && (github.event.inputs.backend != 'true' || needs.backend-deploy.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: site

      # Uploads site/dist as a new Worker version and makes it live.
      # The commit SHA is attached as the version message (see `wrangler deployments list`).
      - name: Deploy to Cloudflare Workers
        id: wrangler
        # TODO: pin to the full commit SHA of the v4 tag; this step holds the deploy token.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy --message "${{ needs.resolve-source.outputs.revision }}"

      - name: Write summary
        env:
          URL: ${{ steps.wrangler.outputs.deployment-url }}
          SHA: ${{ needs.resolve-source.outputs.revision }}
        run: |
          echo "Frontend deployed from \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$URL" ] && echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY" || true

  # ── Android: build the signed APK (runs alongside the deploys) ─────────────
  android-build:
    name: Android · build signed APK
    needs: [resolve-source, frontend-build]
    if: ${{ github.event.inputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db-world-frontend/package-lock.json

      - name: Set up Java (with Gradle cache)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # versionName: the `version` input, or the latest release's patch + 1 (3.1.0 → 3.1.1),
      #              or 3.0.0 when no release exists yet.
      # versionCode: minutes since the Unix epoch — always increasing and within
      #              Android's signed 32-bit limit.
      - name: Resolve version (name + code)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          IN_NAME: ${{ github.event.inputs.version }}
        run: |
          NAME="${IN_NAME#v}"
          if [ -z "$NAME" ]; then
            LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            LATEST="${LATEST#v}"
            if [ -z "$LATEST" ]; then
              NAME="3.0.0"
            else
              NAME=$(echo "$LATEST" | awk -F. -v OFS=. '{ $NF = $NF + 1; print }')
            fi
          fi
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Android version must be numeric major.minor.patch (got '$NAME')."
            exit 1
          fi
          CODE="$(( $(date -u +%s) / 60 ))"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved v$NAME (versionCode $CODE)"

      # Same bundle the website gets, so web and app ship identical frontend code.
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: db-world-frontend

      # Copies dist/ into the Android project and updates native plugins.
      - name: Install dependencies and sync Capacitor
        working-directory: db-world-frontend
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      # Without this file the APK still builds but has no push notifications.
      - name: Add google-services.json (Firebase / FCM)
        working-directory: db-world-frontend
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — APK will have no push notifications."
          fi

      # Writes the keystore and keystore.properties read by app/build.gradle.
      # Without the keystore secret the APK is debug-signed and unfit for release.
      - name: Configure release signing
        working-directory: db-world-frontend/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be DEBUG-signed."
          fi

      # --stacktrace shows the real cause when packaging fails inside a Gradle worker.
      - name: Assemble release APK
        working-directory: db-world-frontend/android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/db-world-${VERSION_NAME}.apk"

      # Metadata the in-app updater downloads to decide whether to prompt the user.
      - name: Write version.json
        env:
          CODE: ${{ steps.ver.outputs.code }}
          NAME: ${{ steps.ver.outputs.name }}
          MAND: ${{ github.event.inputs.mandatory }}
          AUDIENCE: ${{ github.event.inputs.audience }}
          LOG: ${{ github.event.inputs.changelog }}
        run: |
          APK="https://github.com/$GITHUB_REPOSITORY/releases/download/v${NAME}/db-world-${NAME}.apk"
          jq -n --argjson code "$CODE" --arg name "$NAME" --argjson mandatory "$MAND" \
                --arg audience "$AUDIENCE" --arg apk "$APK" --arg changelog "$LOG" \
             '{versionCode:$code, versionName:$name, mandatory:$mandatory, minSupportedCode:0,
               releaseAudience:$audience, apkUrl:$apk, changelog:$changelog}' \
             > "$GITHUB_WORKSPACE/version.json"
          cat "$GITHUB_WORKSPACE/version.json"

      - name: Upload APK and version.json
        uses: actions/upload-artifact@v7
        with:
          name: android-release-files
          path: |
            db-world-*.apk
            version.json
          if-no-files-found: error
          retention-days: 1

  # ── Android: publish the GitHub Release after all ticked deploys succeed ───
  android-release:
    name: Android · publish APK release
    needs: [resolve-source, android-build, backend-deploy, frontend-deploy]
    if: >-
      ${{ always() && !cancelled() && github.event.inputs.android == 'true'
          && needs.android-build.result == 'success'
          && (github.event.inputs.backend != 'true' || needs.backend-deploy.result == 'success')
          && (github.event.inputs.frontend != 'true' || needs.frontend-deploy.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and Release
    steps:
      - name: Download APK and version.json
        uses: actions/download-artifact@v8
        with:
          name: android-release-files
          path: release

      # Pinned to a commit SHA because this job can write to the repo. v3 = 3d0d988.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.android-build.outputs.version }}
          name: v${{ needs.android-build.outputs.version }}
          target_commitish: ${{ needs.resolve-source.outputs.revision }}
          generate_release_notes: true
          files: |
            release/db-world-*.apk
            release/version.json

      - name: Write summary
        env:
          VERSION: ${{ needs.android-build.outputs.version }}
        run: echo "Android release \`v$VERSION\` published" >> "$GITHUB_STEP_SUMMARY"

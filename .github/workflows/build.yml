name: Build

# Builds artifacts ONLY — a backend WAR, a web bundle, and/or an installable (debug) APK — and
# uploads them as workflow artifacts. It NEVER deploys to the Pi or publishes a release; use the
# "Deploy & Release" workflow for that. Tick any combination of backend / frontend / android.
#
# Optional secrets: FRONTEND_ENV_PRODUCTION (web env incl. VITE_FIREBASE_*),
# GOOGLE_SERVICES_JSON_BASE64 (Android FCM config). Missing secrets just build with defaults.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Build the backend WAR
        type: boolean
        default: false
      frontend:
        description: Build the frontend web bundle
        type: boolean
        default: true
      android:
        description: Build the Android APK (debug)
        type: boolean
        default: false
      ref:
        description: "Version to build — a branch, tag (e.g. v3.0.3) or commit SHA. Blank = the ref you launched this from."
        required: false

concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend · build WAR
    if: ${{ github.event.inputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package WAR
        working-directory: db-world-backend
        run: mvn -B -ntp -P prod -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: backend-war
          path: db-world-backend/target/*.war
          if-no-files-found: error

  frontend:
    name: Frontend · build web bundle
    if: ${{ github.event.inputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build web bundle
        working-directory: db-world-frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          npm ci --no-audit --no-fund
          if [ -n "$FRONTEND_ENV_PRODUCTION" ]; then
            mkdir -p ../runtime && printf '%s' "$FRONTEND_ENV_PRODUCTION" > ../runtime/.env.production
            npm run build:production
          else
            echo "FRONTEND_ENV_PRODUCTION not set — building with default env."
            npm run build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: db-world-frontend/dist
          if-no-files-found: error

  android:
    name: Android · build APK (debug)
    if: ${{ github.event.inputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'   # Android Gradle Plugin needs JDK 17 (not the backend's 25)
      - name: Build web bundle + Capacitor sync
        working-directory: db-world-frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          npm ci --no-audit --no-fund
          if [ -n "$FRONTEND_ENV_PRODUCTION" ]; then
            mkdir -p ../runtime && printf '%s' "$FRONTEND_ENV_PRODUCTION" > ../runtime/.env.production
            npm run build:production
          else
            npm run build
          fi
          npx cap sync android
      - name: Inject google-services.json (Firebase / FCM)
        working-directory: db-world-frontend
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 — debug APK builds without push (FCM)."
          fi
      - name: Assemble debug APK
        working-directory: db-world-frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-debug
          path: db-world-frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
